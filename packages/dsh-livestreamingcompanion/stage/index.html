<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dsh-livestreamingcompanion 舞台</title>
<script>
  // 抓屏用：ffmpeg 的 gdigrab title= 匹配不了中文窗口标题（内部按 ANSI 比较），
  // 所以独立舞台窗口带 &win=DSHStage 这样的 ASCII 标题，gdigrab 才能找到它。
  (function () {
    var win = new URLSearchParams(location.search).get('win');
    if (win) document.title = win;
  })();
</script>
<script>document.write('<link rel="stylesheet" href="/stage.css' + location.search + (location.search ? '&' : '?') + 'v=' + Date.now() + '">');</script>
</head>
<body>
<div id="root"></div>
<script>document.write('<script src="/stage.js' + location.search + '"><\/script>');</script>
</body>
</html>
